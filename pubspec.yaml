name: sellulator
description: "Sellulator - kalkulator biaya admin multi marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  archive: ^4.0.7
  xml: ^6.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  window_manager: ^0.5.1
  http: ^1.6.0
  crypto: ^3.0.8
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/marketplace/
    - assets/kalkulator/
    - assets/fonts/OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
